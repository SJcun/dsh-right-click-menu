# dsh-right-click-menu profile bundle patch.
#
# The bundle contributes exactly one Loader row: the plugin package itself.
# Its host half (`lib/index.js`) is an empty `apply` because every behavior
# lives in the browser half (`exports["./client"]`), discovered through the
# `dsh.client` declaration in package.json.
- insert:
    - id: right-click-menu
      name: 'dsh-right-click-menu'
